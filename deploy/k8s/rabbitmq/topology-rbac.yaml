apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: topology-operator-secrets
  namespace: chess
rules:
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: topology-operator-secrets
  namespace: chess
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: topology-operator-secrets
subjects:
  - kind: ServiceAccount
    name: messaging-topology-operator
    namespace: rabbitmq-system
