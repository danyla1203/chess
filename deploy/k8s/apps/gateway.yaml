apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: chess
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: core
spec:
  parentRefs:
    - name: chess
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /socket.io
      backendRefs:
        - name: core
          port: 80
      timeouts:
        request: 0s
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: core
          port: 80
      timeouts:
        request: 30s
