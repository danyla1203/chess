apiVersion: v1
kind: Service
metadata:
  name: game-svc-grpc
  labels:
    app.kubernetes.io/name: game-svc
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: game-svc
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-svc
  labels:
    app.kubernetes.io/name: game-svc
    app.kubernetes.io/part-of: chess
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: game-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: game-svc
        app.kubernetes.io/part-of: chess
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: game-svc
          image: chess-backend
          args: ['node', 'dist/game-service/main.js']
          ports:
            - name: health
              containerPort: 9300
            - name: grpc
              containerPort: 50051
          envFrom:
            - configMapRef:
                name: chess-config
          env:
            - name: HEALTH_PORT
              value: '9300'
            - name: GRPC_PORT
              value: '50051'
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.monitoring:4318
            - name: OTEL_SERVICE_NAME
              value: chess-game-svc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=chess,k8s.pod.name=$(POD_NAME)
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: uri
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 50051
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ['sleep', '5']
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: game-svc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: game-svc
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: game-svc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: game-svc
