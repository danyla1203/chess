apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-svc
  labels:
    app.kubernetes.io/name: game-svc
    app.kubernetes.io/part-of: chess
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: game-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: game-svc
        app.kubernetes.io/part-of: chess
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: game-svc
          image: chess-backend
          args: ['node', 'dist/game-service/main.js']
          ports:
            - name: health
              containerPort: 9300
          envFrom:
            - configMapRef:
                name: chess-config
          env:
            - name: HEALTH_PORT
              value: '9300'
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(HOST_IP):4318
            - name: OTEL_SERVICE_NAME
              value: chess-game-svc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=chess,k8s.pod.name=$(POD_NAME)
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: game-svc-user-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: game-svc-user-credentials
                  key: password
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: game-svc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: game-svc
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: game-svc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: game-svc
