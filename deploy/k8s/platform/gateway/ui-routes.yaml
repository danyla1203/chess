apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: chess
      namespace: chess
  hostnames:
    - grafana.localhost
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: kube-system
spec:
  parentRefs:
    - name: chess
      namespace: chess
  hostnames:
    - headlamp.localhost
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
