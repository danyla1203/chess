prometheus:
  prometheusSpec:
    retention: 15d
    enableOTLPReceiver: true
    enableFeatures:
      - exemplar-storage
    otlp:
      promoteResourceAttributes:
        - service.namespace
        - service.version
        - deployment.environment.name
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.deployment.name
        - k8s.node.name
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ['ReadWriteOnce']
          resources:
            requests:
              storage: 20Gi

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: '1'
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  additionalDataSources:
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring:3200
      jsonData:
        nodeGraph:
          enabled: true
        lokiSearch:
          datasourceUid: loki
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: '-5m'
          spanEndTimeShift: '5m'
          filterByTraceID: true
        tracesToMetrics:
          datasourceUid: prometheus
          spanStartTimeShift: '-5m'
          spanEndTimeShift: '5m'
          tags:
            - key: service.name
              value: job
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring
      jsonData:
        derivedFields:
          - name: TraceID
            matcherType: label
            matcherRegex: trace_id
            datasourceUid: tempo
            url: '$${__value.raw}'
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: community
          orgId: 1
          folder: Community
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/community
  dashboards:
    community:
      rabbitmq-overview:
        gnetId: 10991
        datasource: Prometheus
      nodejs-runtime:
        gnetId: 11159
        datasource: Prometheus

prometheus-node-exporter:
  hostRootFsMount:
    enabled: false
