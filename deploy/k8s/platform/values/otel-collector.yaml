mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  kubernetesAttributes:
    enabled: true

ports:
  otlp:
    enabled: true
    hostPort: 4317
  otlp-http:
    enabled: true
    hostPort: 4318

config:
  processors:
    resource/cluster:
      attributes:
        - key: deployment.environment.name
          value: ${env:DEPLOYMENT_ENVIRONMENT}
          action: upsert
  exporters:
    otlp/tempo:
      endpoint: tempo.monitoring:4317
      tls:
        insecure: true
    otlphttp/prometheus:
      metrics_endpoint: http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/otlp/v1/metrics
      tls:
        insecure: true
    otlphttp/loki:
      endpoint: http://loki-gateway.monitoring/otlp
      tls:
        insecure: true
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, resource/cluster, batch]
        exporters: [otlp/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, resource/cluster, batch]
        exporters: [otlphttp/prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, resource/cluster, batch]
        exporters: [otlphttp/loki]

extraEnvs:
  - name: DEPLOYMENT_ENVIRONMENT
    value: dev

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
