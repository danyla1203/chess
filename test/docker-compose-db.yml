version: '3.9'

services:
  db:
    image: postgres:13
    container_name: test-database
    restart: always
    healthcheck:
      test: /usr/bin/pg_isready
      interval: 5s
      timeout: 10s
      retries: 120
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: danylo
      POSTGRES_PASSWORD: root
      POSTGRES_DB: tests
  redis:
    image: redis:8.10
    container_name: test-redis
    ports:
      - '6391:6379'
  wait_for_db:
    image: hello-world
    depends_on:
      db:
        condition: service_healthy
